<table border="1">
    <tr>
        <td colspan="2">Phương trình bậc 2</td>
    </tr>
    <tr>
        <td>Hệ số a:</td>
        <td>
            <input type="number" [(ngModel)]="hsa" #view_a/>
        </td>
    </tr>
    <tr>
        <td>Hệ số b:</td>
        <td>
            <input type="number" [(ngModel)]="hsb" #view_b/>
        </td>
    </tr>
    <tr>
        <td>Hệ số c:</td>
        <td>
            <input type="number" [(ngModel)]="hsc" #view_c/>
        </td>
    </tr>
    <tr>
        <td>Kết quả:</td>
        <td [innerHTML]="result">
            
        </td>
    </tr>
    <tr>
        <td colspan="2">
            <button (click)="giaiPTbac2()">Giải phương trình</button>
            <button (click)="hsa=0; hsb=0; hsc=0; result='Kết quả ở đây'">PT Mới</button>
        </td>
    </tr>
</table>
