<div class="container my-4">
  <h3 class="text-center text-white bg-dark p-3">Product List</h3>

  @if (errMessage()) {
    <p class="text-danger">{{ errMessage() }}</p>
  }

  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
    @for (p of products(); track p.id) {
      <div class="col">
        <div class="card h-100 product-card">
          <div class="image-box">
            <span class="discount">-25%</span>
            <span class="wishlist">♥</span>
            <img [src]="p.image" [alt]="p.title">
          </div>

          <div class="card-body d-flex flex-column">
            <h6 class="text-truncate mb-0" [title]="p.title">
              {{ p.title }}
            </h6>
            <strong class="text-danger">{{ p.price | currency:'USD' }}</strong>

            <div class="d-flex justify-content-between text-secondary small mt-2">
              <span>★ {{ p.rating.rate }}</span>
              <span>Count: {{ p.rating.count }}</span>
            </div>

            <button type="button"
                    class="btn btn-warning text-white fw-bold w-100 mt-auto">
              Buy Now
            </button>
          </div>
        </div>
      </div>
    } @empty {
      <p>Không có sản phẩm.</p>
    }
  </div>
</div>
